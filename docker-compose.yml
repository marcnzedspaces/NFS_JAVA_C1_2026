services:
  mongo:
    image: mongo:7
    container_name: nfs-java-c1-mongo
    restart: unless-stopped
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=pwd12345
      - MONGO_INITDB_DATABASE=newdb
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: